<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0d1526"/>
  <!-- L-Shape 10mm Toughened Shower Enclosure with PVD Gold Hardware -->
  <g transform="translate(150, 55)">
    <rect x="0" y="0" width="500" height="490" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
    <!-- Clear Tempered Glass Panels -->
    <rect x="40" y="25" width="210" height="445" fill="#7dd3fc" fill-opacity="0.16" stroke="#fbbf24" stroke-width="3"/>
    <rect x="250" y="25" width="210" height="445" fill="#7dd3fc" fill-opacity="0.12" stroke="#fbbf24" stroke-width="3"/>
    <!-- Top Stabilizer Rod in PVD Gold -->
    <line x1="35" y1="38" x2="465" y2="38" stroke="#f59e0b" stroke-width="6"/>
    <!-- Gold Wall Clamps & Hinges -->
    <rect x="34" y="95" width="18" height="24" rx="2" fill="#f59e0b"/>
    <rect x="34" y="370" width="18" height="24" rx="2" fill="#f59e0b"/>
    <rect x="241" y="95" width="18" height="24" rx="2" fill="#f59e0b"/>
    <rect x="241" y="370" width="18" height="24" rx="2" fill="#f59e0b"/>
    <!-- Towel Bar & Pull Handle -->
    <rect x="275" y="210" width="8" height="75" rx="4" fill="#fbbf24"/>
    <line x1="75" y1="245" x2="215" y2="245" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
