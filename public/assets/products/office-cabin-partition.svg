<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0b1324"/>
  <!-- Office Cabin Toughened Glass Partition with Frosted Privacy Band -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="640" height="460" fill="#38bdf8" fill-opacity="0.12" stroke="#334155" stroke-width="8"/>
    <!-- Vertical Glass Joints -->
    <line x1="210" y1="0" x2="210" y2="460" stroke="#94a3b8" stroke-width="2"/>
    <line x1="430" y1="0" x2="430" y2="460" stroke="#94a3b8" stroke-width="2"/>
    <!-- Frosted Film Privacy Strips -->
    <rect x="4" y="175" width="632" height="110" fill="#e2e8f0" fill-opacity="0.22"/>
    <line x1="4" y1="195" x2="636" y2="195" stroke="#09101d" stroke-width="4"/>
    <line x1="4" y1="265" x2="636" y2="265" stroke="#09101d" stroke-width="4"/>
    <!-- Dorma / Ozone Patch Fittings -->
    <rect x="212" y="6" width="38" height="18" rx="2" fill="#cbd5e1"/>
    <rect x="212" y="436" width="38" height="18" rx="2" fill="#cbd5e1"/>
    <!-- SS D-Handle -->
    <rect x="395" y="190" width="8" height="90" rx="4" fill="#f59e0b"/>
  </g>
</svg>
